<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        form{
            background-image: url(imagem/login.jpg);
            padding: 10px;
            text-align: center;
            justify-content: center;
        }

        label{
            display: block;
            font-size: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 5px;
            text-transform: uppercase;
        }

        input{
            font-size: 16px;
            padding: 5px;
            align-items: center;
            border-radius: 5px;
        }

        button{
            font-size: 12px;
            margin-top: 10px;
            padding: 5px;
        }

        button:hover{
            cursor: pointer;
            font-weight: bold;
        }

        footer{
            background-color: aqua;
            width: 70%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 5px;
            text-align: center;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <form action="login">
        <p>
            <label for="user">Usuário</label>
            <input type="text" id="user" name="usuario" placeholder="Digite um usuário">
        </p>
        <p>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite uma senha">
        </p>
        <button type="submit">Enviar</button>
    </form>

    <footer>
        <p>Desenvolvido por Pablo</p>
    </footer>
</body>
</html>
